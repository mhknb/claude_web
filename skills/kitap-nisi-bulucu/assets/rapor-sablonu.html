<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitap Nişi Raporu</title>
<!-- Kitap Nişi Bulucu rapor şablonu. Veri aşağıdaki RAPOR_VERISI işaretine JSON olarak yerleştirilir
     (scripts/rapor.py bunu otomatik yapar). Grafikler için Chart.js kullanılır; internet yoksa
     grafikler yerine tablolar gösterilir, rapor yine okunur. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root {
  --bg: #f6f5f1; --card: #fff; --text: #1d1d1b; --muted: #6b6a65; --line: #e4e2db;
  --accent: #2f5d50; --bar-bg: #ecebe5;
  --good: #2e7d4f; --mid: #b26a00; --bad: #b3261e; --blue: #3d6fb4;
  --c1: #2f5d50; --c2: #3d6fb4; --c3: #b26a00; --c4: #8a4f9e; --c5: #b3261e; --c6: #4f8a8b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --card: #1f201e; --text: #ecebe6; --muted: #a3a29b; --line: #34352f;
    --accent: #7fb7a4; --bar-bg: #2c2d29;
    --good: #7cc69a; --mid: #e0a54a; --bad: #f08a80; --blue: #8db4ec;
    --c1: #7fb7a4; --c2: #8db4ec; --c3: #e0a54a; --c4: #c39bd3; --c5: #f08a80; --c6: #8cc7c8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); word-break: break-word; }
h1 { font-size: 1.7rem; margin: 0 0 .3rem; line-height: 1.25; }
h2 { font-size: 1.25rem; margin: 0 0 .7rem; }
h3 { font-size: 1.02rem; margin: 1.1rem 0 .4rem; }
h4 { font-size: .93rem; margin: .9rem 0 .3rem; }
ul, ol { padding-left: 1.2rem; margin: .3rem 0; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 24px 16px 60px; }
.muted { color: var(--muted); } .small { font-size: .84rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-bottom: 16px; }
.hero { border-left: 6px solid var(--muted); }
.hero.strong { border-left-color: var(--good); } .hero.promising { border-left-color: var(--blue); }
.hero.weak { border-left-color: var(--mid); } .hero.drop { border-left-color: var(--bad); } .hero.uncertain { border-left-color: var(--muted); }
.hero-top, .cand-head { display: flex; justify-content: space-between; gap: 16px; }
.badge { display: inline-block; font-size: 1.7rem; font-weight: 700; color: #fff; padding: 4px 13px; border-radius: 9px; background: var(--muted); white-space: nowrap; }
.badge small { font-size: .7rem; opacity: .85; }
.badge.strong { background: var(--good); } .badge.promising { background: var(--blue); }
.badge.weak { background: var(--mid); } .badge.drop { background: var(--bad); } .badge.uncertain { background: var(--muted); }
@media (prefers-color-scheme: dark) { .badge { color: #10120f; } }
.score-box { text-align: center; min-width: 120px; }
.lead { font-size: 1.05rem; margin: .2rem 0 .6rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .86rem; color: var(--muted); margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: .78rem; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .88rem; }
.facts { display: grid; grid-template-columns: 200px 1fr; gap: 6px 14px; margin: .6rem 0; }
.facts dt { color: var(--muted); font-size: .88rem; } .facts dd { margin: 0; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.statement { font-size: 1.08rem; font-style: italic; border-left: 3px solid var(--accent); padding-left: 12px; }
blockquote { margin: .5rem 0; padding: 4px 0 4px 12px; border-left: 3px solid var(--line); }
.src { font-size: .82rem; color: var(--muted); }
.notice { background: var(--bar-bg); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
.tag { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.t-good { color: var(--good); } .t-mid { color: var(--mid); } .t-bad { color: var(--bad); }
.sb { display: grid; gap: 9px; margin: .6rem 0; }
.sb-row { display: grid; grid-template-columns: 270px 1fr 46px; gap: 3px 12px; align-items: center; }
.sb-label { font-size: .88rem; }
.sb-bar { height: 9px; background: var(--bar-bg); border-radius: 99px; overflow: hidden; }
.sb-bar span { display: block; height: 100%; background: var(--accent); }
.sb-val { font-weight: 600; font-size: .88rem; text-align: right; }
.sb-reason { grid-column: 1 / -1; font-size: .84rem; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td ul { padding-left: 1rem; }
.heat td.h { text-align: center; font-weight: 600; }
.heat .badge { font-size: 1rem; padding: 2px 8px; }
.chart-box { position: relative; height: 320px; }
.chart-fallback { display: none; }
.no-chart .chart-box { display: none; } .no-chart .chart-fallback { display: block; }
.segment { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.segment:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sources-list { font-size: .86rem; }
footer { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 24px; }
@media (max-width: 720px) {
  .facts { grid-template-columns: 1fr; } .facts dt { margin-top: 6px; }
  .cols, .grid2 { grid-template-columns: 1fr; }
  .sb-row { grid-template-columns: 1fr 44px; } .sb-bar { grid-column: 1 / -1; grid-row: 2; }
  .hero-top, .cand-head { flex-direction: column; } .score-box { text-align: left; }
}
@media print {
  body { background: #fff; color: #000; } .card { border: 0; padding: 0 0 14px; break-inside: avoid-page; }
  .toc { display: none; } details > * { display: block; }
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const DATA = /*RAPOR_VERISI*/null;

// ---------- puanlama (scripts/rapor.py ile aynı formül) ----------
const COMPONENTS = [
  ['demand', 'Talep', 20],
  ['competition_gap', 'Rekabet boşluğu', 20],
  ['ai_resilience', 'Yapay zekaya dayanıklılık', 15],
  ['author_fit', 'Yazar uyumu ve güvenilirlik', 15],
  ['earning', 'Kazanç gücü', 10],
  ['evergreen', 'Kalıcılık', 10],
  ['reachability', 'Okura ulaşılabilirlik', 10],
];
const SHORT = { demand: 'Talep', competition_gap: 'Rekabet boşluğu', ai_resilience: 'YZ dayanıklılığı', author_fit: 'Yazar uyumu', earning: 'Kazanç', evergreen: 'Kalıcılık', reachability: 'Ulaşılabilirlik' };
function scoreIdea(scores, policy, ymyl) {
  const s = (k) => Math.max(0, Math.min(10, Number(scores?.[k]?.score) || 0));
  const low = (k) => scores?.[k]?.confidence === 'düşük';
  const raw = Math.round(COMPONENTS.reduce((t, [k, , w]) => t + (s(k) / 10) * w, 0) * 10) / 10;
  const caps = [];
  if (s('demand') <= 3 && !low('demand')) caps.push({ cap: 54, reason: 'Talep çok zayıf' });
  if (s('competition_gap') <= 2 && !low('competition_gap')) caps.push({ cap: 54, reason: 'Rakip kitapların bıraktığı boşluk yok' });
  if (s('ai_resilience') <= 2 && !low('ai_resilience')) caps.push({ cap: 54, reason: 'Yapay zeka bu bilgiyi bedava ve yeterince iyi veriyor' });
  if (ymyl && s('author_fit') <= 4 && !low('author_fit')) caps.push({ cap: 54, reason: 'Sağlık, hukuk veya finans konusunda yazarın yeterli uzmanlığı yok' });
  if (policy === 'yüksek') caps.push({ cap: 54, reason: 'Yayın politikası veya yasal risk yüksek' });
  if (COMPONENTS.some(([k]) => s(k) <= 1 && !low(k))) caps.push({ cap: 34, reason: 'En az bir bileşende ölümcül zayıflık var' });
  const total = Math.min(raw, ...caps.map((c) => c.cap), 100);
  const v = [[75, 'strong', 'Güçlü: yazın'], [55, 'promising', 'Umut verici: önce test edin'], [35, 'weak', 'Zayıf: açıyı değiştirin'], [0, 'drop', 'Bırakın']].find((x) => total >= x[0]);
  const out = { raw, total, capped: total < raw, caps, verdict: v[1], verdict_label: v[2], low_confidence: COMPONENTS.filter(([k]) => low(k)).map(([, l]) => l) };
  const core = ['demand', 'competition_gap', 'ai_resilience', 'earning'];
  if (low('demand') || core.filter(low).length >= 2) Object.assign(out, { likely_verdict_label: v[2], verdict: 'uncertain', verdict_label: 'Belirsiz: önce test edin' });
  return out;
}

// ---------- yardımcılar ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : null);
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const link = (url, text) => { const u = safeUrl(url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(text || host(u))}</a>` : esc(text || ''); };
const list = (a) => (a?.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted">Veri yok</p>');
const tag = (v, highIsGood = false) => `<span class="tag t-${v === 'orta' ? 'mid' : (v === 'yüksek') === highIsGood ? 'good' : 'bad'}">${esc(v)}</span>`;
const badge = (sc) => `<span class="badge ${sc.verdict}">${Math.round(sc.total)}<small>/100</small></span>`;
const card = (id, title, body) => `<section class="card" id="${id}"><h2>${title}</h2>${body}</section>`;
const evidence = (ev) => (ev?.length ? `<ul>${ev.map((e) => `<li>${esc(e.claim)} ${e.url ? `<span class="src">(${link(e.url)})</span>` : ''}</li>`).join('')}</ul>` : '<p class="muted">Kanıt yok</p>');
const facts = (rows) => `<dl class="facts">${rows.filter((r) => r[1] !== undefined).map(([k, v, raw]) => `<dt>${k}</dt><dd>${raw ? v : esc(v)}</dd>`).join('')}</dl>`;
const COLORS = () => { const cs = getComputedStyle(document.documentElement); return ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'].map((v) => cs.getPropertyValue(v).trim()); };

function scoreBars(scores, sc) {
  const rows = COMPONENTS.map(([k, label, w]) => {
    const s = scores?.[k] || {};
    return `<div class="sb-row"><div class="sb-label">${esc(label)} <span class="muted">%${w}</span></div>
      <div class="sb-bar"><span style="width:${Math.max(0, Math.min(10, s.score || 0)) * 10}%"></span></div>
      <div class="sb-val">${s.score ?? '-'}/10</div><div class="sb-reason">${s.confidence ? `<span class="tag ${s.confidence === 'düşük' ? 't-bad' : s.confidence === 'orta' ? 't-mid' : 't-good'}">güven: ${esc(s.confidence)}</span> ` : ''}${esc(s.reason)}</div></div>`;
  }).join('');
  const caps = sc?.capped ? `<p class="notice">Ham puan ${Math.round(sc.raw)} idi; şu nedenle ${Math.round(sc.total)}'e sınırlandı: ${esc(sc.caps.map((c) => c.reason).join('; '))}</p>` : '';
  const unc = sc?.verdict === 'uncertain' ? `<p class="notice"><b>Belirsiz:</b> Kanıtı zayıf bileşenler var (${esc((sc.low_confidence || []).join(', '))}). Puan ${Math.round(sc.total)}, olası karar "${esc(sc.likely_verdict_label)}", ama masa başı araştırma karar için yetmiyor. Test planındaki deney yapılmalı.</p>` : '';
  return `<div class="sb">${rows}</div>${caps}${unc}`;
}

// Grafikler sayfa çizildikten sonra oluşturulur.
const pendingCharts = [];
function chart(id, config, fallbackHtml = '') {
  pendingCharts.push([id, config]);
  return `<div class="chart-box"><canvas id="${id}"></canvas></div><div class="chart-fallback">${fallbackHtml}</div>`;
}
function drawCharts() {
  if (!window.Chart) { document.body.classList.add('no-chart'); return; }
  const cs = getComputedStyle(document.documentElement);
  Chart.defaults.color = cs.getPropertyValue('--muted').trim();
  Chart.defaults.borderColor = cs.getPropertyValue('--line').trim();
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  for (const [id, cfg] of pendingCharts) {
    const el = document.getElementById(id);
    if (el) new Chart(el, { ...cfg, options: { responsive: true, maintainAspectRatio: false, ...(cfg.options || {}) } });
  }
}

function radarChart(id, scores) {
  const c = COLORS();
  return chart(id, {
    type: 'radar',
    data: { labels: COMPONENTS.map(([k]) => SHORT[k]), datasets: [{ label: 'Puan', data: COMPONENTS.map(([k]) => scores?.[k]?.score ?? 0), borderColor: c[0], backgroundColor: c[0] + '33', pointBackgroundColor: c[0] }] },
    options: { scales: { r: { min: 0, max: 10, ticks: { stepSize: 2, backdropColor: 'transparent' } } }, plugins: { legend: { display: false } } },
  });
}

function extraCharts(d) {
  if (!d.ek_grafikler?.length) return '';
  const c = COLORS();
  return d.ek_grafikler.map((g, i) => {
    const multi = g.seriler.length > 1 || ['line', 'scatter', 'radar'].includes(g.tur);
    const ds = g.seriler.map((s, j) => ({
      label: s.ad, data: s.veri,
      backgroundColor: multi ? c[j % c.length] + (g.tur === 'line' || g.tur === 'radar' ? '33' : '') : g.seriler[0].veri.map((_, k) => c[k % c.length]),
      borderColor: c[j % c.length], tension: 0.25,
    }));
    const table = `<div class="table-wrap"><table><thead><tr><th></th>${(g.etiketler || g.seriler[0].veri.map((_, k) => k + 1)).map((l) => `<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>${g.seriler.map((s) => `<tr><td>${esc(s.ad)}</td>${s.veri.map((v) => `<td>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return `<section class="card"><h2>${esc(g.baslik)}</h2>${g.aciklama ? `<p class="muted">${esc(g.aciklama)}</p>` : ''}
      ${chart('ek' + i, { type: g.tur, data: { labels: g.etiketler, datasets: ds }, options: { plugins: { legend: { display: multi || ['pie', 'doughnut'].includes(g.tur) } } } }, table)}
      ${g.kaynak_url ? `<p class="src">Kaynak: ${link(g.kaynak_url)}</p>` : ''}</section>`;
  }).join('');
}

function extraSections(d) {
  return (d.ek_bolumler || []).map((b) => `<section class="card"><h2>${esc(b.baslik)}</h2>
    ${b.metin ? esc(b.metin).split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('') : ''}
    ${b.tablo ? `<div class="table-wrap"><table><thead><tr>${b.tablo.basliklar.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.tablo.satirlar.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
  </section>`).join('');
}

function header(d, kind, sc) {
  const m = d.meta || {};
  const kinds = { kesif: 'Kitap nişi keşfi', dogrulama: 'Kitap doğrulama' };
  return `<header class="card">
    <div class="muted small">${kinds[kind]} raporu</div>
    <h1>${esc(m.baslik || 'Kitap Nişi Raporu')}</h1>
    <div class="meta">${m.tarih ? `<span>Tarih: ${esc(m.tarih)}</span>` : ''}${m.pazar ? `<span>Pazar: ${esc(m.pazar)}</span>` : ''}</div>
    ${m.kullanilan_kaynaklar?.length ? `<div class="chips">${m.kullanilan_kaynaklar.map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</div>` : ''}
    ${m.sinirlamalar?.length ? `<div class="notice small"><b>Sınırlamalar:</b> ${esc(m.sinirlamalar.join(' · '))}</div>` : ''}
  </header>`;
}

// ---------- kazanç (scripts/rapor.py ile aynı hesap) ----------
const sumItems = (a) => (a || []).reduce((t, x) => t + (Number(typeof x === 'object' ? x.tutar : x) || 0), 0);
function computeEarnings(k) {
  const formats = (k.formatlar || []).map((f) => ({ format: f.format, platform: f.platform, net: (Number(f.liste_fiyati) || 0) * (Number(f.telif_orani) || 0) - (Number(f.baski_maliyeti) || 0) - sumItems(f.kesintiler), pay: Number(f.pay) || 0 }));
  let share = formats.reduce((t, x) => t + x.pay, 0);
  if (formats.length && share <= 0) { formats.forEach((x) => (x.pay = 1 / formats.length)); share = 1; }
  const w = share ? formats.reduce((t, x) => t + x.net * x.pay, 0) / share : 0;
  const start = sumItems(k.baslangic);
  const out = { formatlar: formats.map((x) => ({ ...x, net: Math.round(x.net * 100) / 100 })), kopya_basi_net: Math.round(w * 100) / 100, baslangic_toplam: start, basa_bas_adet: w > 0 ? Math.ceil(start / w) : null, uyarilar: [] };
  if (k.hedef_aylik_gelir && w > 0) out.hedef_icin_aylik_adet = Math.ceil(Number(k.hedef_aylik_gelir) / w);
  out.senaryolar = (k.aylik_satis_senaryolari || []).map((s) => { const n = Number(s.adet) || 0, m = n * w; return { senaryo: s.senaryo, aylik_adet: n, aylik_gelir: Math.round(m), yillik_gelir: Math.round(m * 12), ilk_yil_net: Math.round(m * 12 - start), geri_odeme_ayi: m > 0 ? Math.ceil(start / m) : null }; });
  if (formats.some((x) => x.net <= 0)) out.uyarilar.push('En az bir formatta kopya başı kazanç sıfır veya negatif.');
  if (w > 0 && w < 1.5 && ['$', 'USD', '€', '£'].includes(k.para_birimi || '$')) out.uyarilar.push('Kopya başı kazanç çok düşük; anlamlı gelir için çok yüksek satış adedi gerekir.');
  return out;
}
function renderKazanc(d) {
  const k = d.kazanc; if (!k) return '';
  const h = d.kazanc_hesap || computeEarnings(k), cur = k.para_birimi || '', c = COLORS();
  const m = (n, dec = 0) => (n === null || n === undefined ? '—' : `${Number(n).toLocaleString('tr-TR', { maximumFractionDigits: dec, minimumFractionDigits: dec })} ${esc(cur)}`);
  const src = (k.formatlar || []).map((f) => f.kaynak).filter(Boolean);
  return card('kazanc', 'Kitap başı kazanç', `
    ${h.uyarilar?.length ? `<p class="notice"><b>Dikkat:</b> ${esc(h.uyarilar.join(' · '))}</p>` : ''}
    ${facts([['Kopya başı ortalama net', m(h.kopya_basi_net, 2), true], ['Başlangıç masrafları', m(h.baslangic_toplam), true], ['Masrafları çıkarmak için', h.basa_bas_adet ? `${h.basa_bas_adet} satış` : '—', true], ['Hedef gelir için', h.hedef_icin_aylik_adet ? `ayda ${h.hedef_icin_aylik_adet} satış` : '—', true]])}
    <div class="table-wrap"><table><thead><tr><th>Format</th><th>Platform</th><th>Kopya başı net</th><th>Satış payı</th></tr></thead><tbody>${h.formatlar.map((f) => `<tr><td>${esc(f.format)}</td><td>${esc(f.platform)}</td><td class="${f.net > 0 ? 't-good' : 't-bad'}">${m(f.net, 2)}</td><td>%${Math.round(f.pay * 100)}</td></tr>`).join('')}</tbody></table></div>
    ${h.senaryolar.length ? chart('kz', { type: 'bar', data: { labels: h.senaryolar.map((s) => `${s.senaryo} (${s.aylik_adet}/ay)`), datasets: [{ label: 'Aylık gelir', data: h.senaryolar.map((s) => s.aylik_gelir), backgroundColor: c[0] }, { label: 'İlk yıl net (masraflar düşülmüş)', data: h.senaryolar.map((s) => s.ilk_yil_net), backgroundColor: c[1] }] } }) : ''}
    <div class="table-wrap"><table><thead><tr><th>Senaryo</th><th>Aylık satış</th><th>Aylık gelir</th><th>Yıllık gelir</th><th>İlk yıl net</th><th>Masraflar kaçıncı ayda çıkar</th></tr></thead><tbody>${h.senaryolar.map((s) => `<tr><td>${esc(s.senaryo)}</td><td>${s.aylik_adet}</td><td>${m(s.aylik_gelir)}</td><td>${m(s.yillik_gelir)}</td><td class="${s.ilk_yil_net >= 0 ? 't-good' : 't-bad'}">${m(s.ilk_yil_net)}</td><td>${s.geri_odeme_ayi ? s.geri_odeme_ayi + '. ay' : '—'}</td></tr>`).join('')}</tbody></table></div>
    <details><summary>Girdiler ve kaynakları</summary><ul>${(k.baslangic || []).map((x) => `<li>${esc(x.kalem)}: ${m(x.tutar)} <span class="src">${safeUrl(x.kaynak) ? link(x.kaynak) : esc(x.kaynak || '')}</span></li>`).join('')}</ul>
    ${src.length ? `<p class="src">Telif ve baskı kuralları: ${src.map((u) => (safeUrl(u) ? link(u) : esc(u))).join(' · ')}</p>` : ''}${k.notlar ? `<p class="muted">${esc(k.notlar)}</p>` : ''}</details>`);
}

// ---------- keşif ----------
function renderKesif(d) {
  d.candidates.forEach((c) => (c.score = c.score || scoreIdea(c.scores, c.policy_risk, c.ymyl)));
  const c = COLORS();
  const heat = `<div class="table-wrap"><table class="heat"><thead><tr><th>Aday</th>${COMPONENTS.map(([k]) => `<th>${SHORT[k]}</th>`).join('')}<th>Toplam</th></tr></thead><tbody>
    ${d.candidates.map((x, i) => `<tr><td><a href="#aday-${i}">${esc(x.working_title)}</a></td>${COMPONENTS.map(([k]) => { const v = x.scores?.[k]?.score ?? 0; const lc = x.scores?.[k]?.confidence === 'düşük'; return `<td class="h ${v >= 7 ? 't-good' : v >= 4 ? 't-mid' : 't-bad'}" title="${lc ? 'güven düşük' : ''}">${v}${lc ? '?' : ''}</td>`; }).join('')}<td class="h">${badge(x.score)}</td></tr>`).join('')}
  </tbody></table></div><p class="muted small">"?" işareti: bu puanın kanıtı zayıf (güven düşük).</p>`;
  return `${header(d, 'kesif')}
  ${card('ozet', 'Pazar gözlemi', `<p>${esc(d.market_notes)}</p>${d.excluded_niches?.length ? `<h3>Elenen nişler</h3><ul>${d.excluded_niches.map((x) => `<li><b>${esc(x.niche)}</b>: ${esc(x.reason)}</li>`).join('')}</ul>` : ''}`)}
  ${card('karsilastirma', 'Adayların karşılaştırması', `${chart('toplam', { type: 'bar', data: { labels: d.candidates.map((x) => x.working_title), datasets: [{ label: 'Toplam puan', data: d.candidates.map((x) => Math.round(x.score.total)), backgroundColor: d.candidates.map((x) => ({ strong: c[0], promising: c[1], weak: c[2], drop: c[4], uncertain: c[5] })[x.score.verdict]) }] }, options: { indexAxis: 'y', scales: { x: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } })}<h3>Puan matrisi (0-10)</h3>${heat}`)}
  ${d.candidates.map((x, i) => `<section class="card" id="aday-${i}">
    <div class="cand-head"><div><div class="muted small">#${i + 1} · ${esc(x.book_type)} · ${esc(x.language)} · ${esc(x.platform)}</div><h2>${esc(x.working_title)}</h2><p class="lead">${esc(x.subtitle)}</p></div>
    <div class="score-box">${badge(x.score)}<div class="small">${esc(x.score.verdict_label)}</div></div></div>
    ${facts([['Niş', x.niche], ['Okur', x.target_reader], ['Okurun sorunu', x.reader_problem], ['Neden satın alır', x.why_buy], ['Rakip kitaplar', x.competition_snapshot], ['Boşluk', x.gap], ['En büyük risk', x.main_risk], ['Hassas konu (sağlık/hukuk/finans)', x.ymyl ? 'Evet: yazar uzmanlığı şart' : 'Hayır'], ['Yayın/yasal risk', tag(x.policy_risk), true]])}
    <details><summary>Puan ayrıntısı ve kanıtlar</summary>${scoreBars(x.scores, x.score)}<h3>Kanıtlar</h3>${evidence(x.evidence)}</details>
  </section>`).join('')}
  ${extraCharts(d)}${extraSections(d)}`;
}

// ---------- doğrulama ----------
function renderDogrulama(d) {
  const sc = (d.score = d.score || scoreIdea(d.scores, d.policy_risk, d.ymyl));
  const s = d.summary, dm = d.demand, mp = d.market_position, po = d.positioning, md = d.metadata, fp = d.format_and_price, lp = d.launch_plan, vp = d.validation_plan;
  const toc = [['puan', 'Puan'], ['okur', 'Okur'], ['talep', 'Talep'], ['rakipler', 'Rakip kitaplar'], ['pazar', 'Pazar'], ['konum', 'Konumlandırma'], ['metadata', 'Başlık ve kelimeler'], ['icerik', 'İçerik'], ['format', 'Format ve fiyat']];
  if (d.kazanc) toc.push(['kazanc', 'Kazanç']);
  toc.push(['riskler', 'Riskler'], ['yayin', 'Yayın planı'], ['plan', 'Test planı'], ['kaynaklar', 'Kaynaklar']);
  return `${header(d, 'dogrulama')}
  <section class="card hero ${sc.verdict}">
    <div class="hero-top"><div><h2>${esc(s.working_title)}</h2><p class="lead">${esc(s.one_liner)}</p></div>
    <div class="score-box">${badge(sc)}<div class="small"><b>${esc(sc.verdict_label)}</b></div></div></div>
    <p>${esc(s.verdict_reason)}</p>${facts([['En büyük risk', s.biggest_risk], ['Sonraki adım', s.next_action], ['Hassas konu', d.ymyl ? 'Evet (sağlık/hukuk/finans): yazar uzmanlığı ve doğruluk kritik' : 'Hayır']])}
  </section>
  <nav class="card toc">${toc.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('')}</nav>
  ${card('puan', 'Puan ayrıntısı', `<div class="grid2"><div>${radarChart('radar', d.scores)}</div><div>${scoreBars(d.scores, sc)}</div></div>`)}
  ${card('okur', 'Okur kitlesi', `${d.readers.segments.map((g) => `<div class="segment">
      <h3>${esc(g.name)} ${g.validated ? '<span class="tag t-good">doğrulandı</span>' : '<span class="tag t-mid">doğrulanmadı</span>'}</h3>
      <p>${esc(g.description)}</p>${facts([['Büyüklük', g.size_estimate], ['Satın alma kanıtı', g.buying_evidence]])}
      <div class="cols"><div><h4>Beklentiler</h4>${list(g.expectations)}</div><div><h4>Sorunlar</h4>${list(g.pains)}</div></div>
      <h4>Okurların toplandığı yerler</h4><ul>${(g.platforms || []).map((p) => `<li><b>${link(p.url, p.name)}</b>${p.note ? `: ${esc(p.note)}` : ''}</li>`).join('')}</ul>
      <details><summary>Kanıtlar</summary>${evidence(g.evidence)}</details></div>`).join('')}
    ${d.readers.excluded_segments?.length ? `<h3>Hedeflenmemesi gereken okurlar</h3><ul>${d.readers.excluded_segments.map((x) => `<li><b>${esc(x.name)}</b>: ${esc(x.reason)}</li>`).join('')}</ul>` : ''}`)}
  ${card('talep', 'Talep kanıtı', `${facts([['Satış sıralamaları', dm.bsr_summary], ['Trend', dm.trend], ['Kalıcılık', dm.evergreen_note]])}
    <h3>Amazon'da insanların aradığı ifadeler</h3>${dm.amazon_suggestions?.length ? dm.amazon_suggestions.map((a) => `<p><b>${esc(a.prefix)}</b> → ${(a.suggestions || []).map((x) => `<span class="chip">${esc(x)}</span>`).join(' ')}</p>`).join('') : '<p class="muted">Veri yok</p>'}`)}
  ${card('rakipler', 'Rakip kitaplar', `<div class="table-wrap"><table><thead><tr><th>Kitap</th><th>Yıl</th><th>Format / fiyat</th><th>Sayfa</th><th>Puan (adet)</th><th>Satış sıralaması</th><th>Güçlü</th><th>Okur şikâyetleri</th></tr></thead><tbody>
    ${d.competitor_books.map((x) => `<tr><td><b>${link(x.url, x.title)}</b><div class="small muted">${esc(x.author)}${x.is_major_publisher ? ' · büyük yayınevi' : ''}</div></td><td>${esc(x.year)}</td><td>${esc(x.format)} · ${esc(x.price)}</td><td>${esc(x.pages)}</td><td>${esc(x.rating)} (${esc(x.rating_count)})</td><td>${esc(x.bsr)}</td><td>${list(x.strengths)}</td><td>${list(x.reader_complaints)}</td></tr>`).join('')}</tbody></table></div>`)}
  ${card('pazar', 'Pazardaki konum', facts([['Doygunluk', tag(mp.saturation), true], ['Boşluk', mp.gap], ['Neden şimdi', mp.why_now], ['Yapay zeka tehdidi', mp.ai_threat]]))}
  ${card('konum', 'Konumlandırma', `<p class="statement">${esc(po.statement)}</p>${facts([['Açı', po.angle], ['Okura vaat', po.promise]])}
    <div class="cols"><div><h4>Sadece bu kitapta olanlar</h4>${list(po.unique_elements)}</div><div><h4>Benzer başlıklar (karşılaştırma)</h4>${list(po.comp_titles)}</div></div>`)}
  ${card('metadata', 'Başlık, anahtar kelimeler ve kategoriler', `<div class="table-wrap"><table><thead><tr><th>Başlık</th><th>Alt başlık</th><th>Neden</th></tr></thead><tbody>${md.title_options.map((t) => `<tr><td><b>${esc(t.title)}</b></td><td>${esc(t.subtitle)}</td><td>${esc(t.rationale)}</td></tr>`).join('')}</tbody></table></div>
    <h3>Anahtar kelimeler (7 alan)</h3><div class="chips">${(md.keywords_7 || []).map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</div>
    <h3>Kategoriler</h3>${list(md.categories)}<h3>Açıklama metninin girişi</h3><p class="statement">${esc(md.description_hook)}</p>`)}
  ${card('icerik', 'İçindekiler taslağı', `<ol>${d.outline.chapters.map((ch) => `<li><b>${esc(ch.title)}</b><div class="small muted">${esc(ch.summary)}</div></li>`).join('')}</ol><h4>Ekler</h4>${list(d.outline.extras)}`)}
  ${card('format', 'Format, fiyat ve kapak', `${facts([['Formatlar', (fp.formats || []).join(', ')], ['Önerilen fiyat', fp.recommended_price], ['Sayfa sayısı', fp.page_count], ['Gerekçe', fp.rationale]])}
    <h3>Kapak tarifi</h3>${facts([['Fikir', d.cover_brief.concept], ['Renkler', d.cover_brief.colors], ['Yazı tipi', d.cover_brief.typography], ['Kaçınılacaklar', d.cover_brief.must_avoid]])}
    <h3>Seri potansiyeli</h3>${d.series_potential.possible ? list(d.series_potential.titles) : '<p class="muted">Seri için uygun değil</p>'}`)}
  ${renderKazanc(d)}
  ${d.alternative_angles?.length ? card('acilar', 'Alternatif açılar (yeniden konumlandırma)', `<div class="table-wrap"><table><thead><tr><th>Açı</th><th>Ne değişiyor</th><th>Neden</th></tr></thead><tbody>${d.alternative_angles.map((a) => `<tr><td><b>${esc(a.angle)}</b></td><td>${esc(a.change)}</td><td>${esc(a.why)}</td></tr>`).join('')}</tbody></table></div>`) : ''}
  ${card('riskler', 'Riskler', `<p>Genel yayın/yasal risk: ${tag(d.policy_risk)}</p><div class="table-wrap"><table><thead><tr><th>Tür</th><th>Risk</th><th>Önem</th><th>Nasıl azaltılır</th></tr></thead><tbody>${d.risks.map((x) => `<tr><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td>${tag(x.severity)}</td><td>${esc(x.mitigation)}</td></tr>`).join('')}</tbody></table></div>`)}
  ${card('yayin', 'Yayın ve tanıtım planı', `<div class="cols"><div><h4>Yayından önce</h4>${list(lp.pre_launch)}</div><div><h4>Yayın haftası</h4>${list(lp.launch)}</div></div><h4>İlk 90 gün</h4>${list(lp.first_90_days)}${facts([['Yorum stratejisi', lp.reviews_strategy], ['Reklam', lp.ads_note]])}`)}
  ${card('plan', 'Yazmadan önce test planı', `${facts([['En riskli varsayım', vp.riskiest_assumption], ['Deney', vp.experiment.method], ['Bütçe / süre', `${vp.experiment.budget} · ${vp.experiment.duration}`], ['Başarı ölçütü', vp.experiment.success_criteria]])}<h4>Adımlar</h4>${list(vp.experiment.steps)}<h4>Şu olursa bırakın</h4>${list(vp.kill_criteria)}`)}
  ${extraCharts(d)}${extraSections(d)}
  ${card('eksikler', 'Doğrulanamayanlar', list(d.data_gaps))}
  ${card('kaynaklar', 'Kaynaklar', `<ol class="sources-list">${d.sources.map((x) => `<li>${link(x.url, x.title || x.url)}</li>`).join('')}</ol>`)}`;
}

const app = document.getElementById('app');
try {
  if (!DATA) app.innerHTML = '<section class="card"><h1>Boş rapor şablonu</h1><p>Bu dosya Kitap Nişi Bulucu skill\'inin rapor şablonudur. Veri yerleştirilmemiş.</p></section>';
  else {
    const r = { kesif: renderKesif, dogrulama: renderDogrulama }[DATA.tur];
    app.innerHTML = (r ? r(DATA) : '<p>Bilinmeyen rapor türü</p>') + '<footer>Kitap Nişi Bulucu ile hazırlandı. Önemli kararlardan önce kaynak linklerini ve platformların güncel kurallarını kontrol edin.</footer>';
    drawCharts();
  }
} catch (e) {
  app.innerHTML = `<section class="card"><h1>Rapor gösterilemedi</h1><p>${esc(e.message)}</p></section>`;
}
</script>
</body>
</html>
